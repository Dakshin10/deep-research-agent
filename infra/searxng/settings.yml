use_default_settings: true

general:
  debug: false
  instance_name: "Deep Research Metasearch"
  donation_url: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "deep_research_searxng_secret_key_production_grade"
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: true
  infinite_scroll: false

engines:
  - name: google
    engine: google
    shortcut: go
    use_mobile_ui: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: bing
    engine: bing
    shortcut: bi
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
  - name: arxiv
    engine: arxiv
    shortcut: arx
  - name: github
    engine: github
    shortcut: gh
  - name: reddit
    engine: reddit
    shortcut: rd
  - name: wikidata
    engine: wikidata
    shortcut: wd
