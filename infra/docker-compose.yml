version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deep_research_postgres
    environment:
      POSTGRES_DB: deep_research
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d deep_research"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: deep_research_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  langfuse:
    image: langfuse/langfuse:2
    container_name: deep_research_langfuse
    environment:
      - DATABASE_URL=postgresql://app_user:app_password@postgres:5432/deep_research
      - NEXTAUTH_SECRET=changeme_langfuse_secret_32_characters
      - SALT=changeme_langfuse_salt_32_characters
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: deep_research_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_user:app_password@postgres:5432/deep_research
      - DATABASE_URL_SYNC=postgresql://app_user:app_password@postgres:5432/deep_research
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=deep-research-artifacts
      - MINIO_SECURE=false
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEARXNG_URL=http://searxng:8080
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-mock}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-mock}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng:latest
    container_name: deep_research_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
