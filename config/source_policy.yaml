# Source Crawling & Scraping Policy Configuration
# Defines allowed sites, access methods, robots.txt compliance, and rate limits.
# Unknown sites: allowed only through search-engine results with robots.txt obeyed.

default_policy:
  allowed: false
  allow_via_search_result: true
  robots_respected: true
  rate_limit_rps: 0.5
  max_pages_per_run: 50
  notes: "Default for unlisted domains: scraping disallowed; accessible only via verified search engine result hits."

